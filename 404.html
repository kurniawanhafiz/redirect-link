<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Tidak Ditemukan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        accentBlue: '#0066ff',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: 'Inter', sans-serif;
        }
        .glow-text {
            text-shadow: 0 0 30px rgba(0, 102, 255, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 selection:bg-blue-600 selection:text-white">

    <main class="max-w-md w-full text-center space-y-6">
        
        <!-- Status Badge -->
        <div class="inline-flex items-center space-x-2 px-3.5 py-1.5 rounded-full bg-blue-950/40 border border-blue-500/30 text-blue-400 text-xs font-semibold tracking-wider uppercase">
            <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
            <span>Error 404 • Invalid or Expired</span>
        </div>

        <!-- Big 404 Number -->
        <div class="space-y-2">
            <h1 class="text-7xl md:text-8xl font-extrabold tracking-tight text-white glow-text">
                404
            </h1>
            <h2 class="text-xl md:text-2xl font-bold tracking-tight text-white">
                Link Tidak Ditemukan atau Telah Kedaluwarsa
            </h2>
        </div>

        <!-- Description -->
        <p class="text-gray-400 text-sm md:text-base leading-relaxed">
            Tautan yang kamu akses melalui <code class="text-blue-400 bg-blue-950/50 px-2 py-0.5 rounded text-xs border border-blue-900 font-mono">go.kurniawanhafiz.web.id</code> tidak valid, salah penulisan, atau masa aktifnya sudah habis.
        </p>

    </main>

</body>
</html>
